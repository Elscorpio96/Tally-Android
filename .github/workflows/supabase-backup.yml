# Daily encrypted backup of your Supabase database + a keep-alive (free projects pause after a week of no activity).
# Setup: put this project in a PRIVATE GitHub repository, then Settings -> Secrets and variables -> Actions:
#   SUPABASE_DB_URL   session-pooler connection string (Supabase -> Connect)
#   BACKUP_PASSPHRASE a long passphrase you keep somewhere safe (without it the backups cannot be opened)
name: supabase-backup
on:
  schedule: [{ cron: "30 2 * * *" }]     # every night, 03:30 Nigeria time
  workflow_dispatch: {}
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/trusted.gpg.d/pgdg.asc >/dev/null
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump
        env: { SUPABASE_DB_URL: "${{ secrets.SUPABASE_DB_URL }}" }
        run: PATH=/usr/lib/postgresql/17/bin:$PATH sh supabase/backup/backup.sh out
      - name: Encrypt
        env: { P: "${{ secrets.BACKUP_PASSPHRASE }}" }
        run: |
          for f in out/*.dump; do gpg --batch --yes --pinentry-mode loopback --passphrase "$P" --symmetric --cipher-algo AES256 -o "$f.gpg" "$f"; rm "$f"; done
          ls -l out
      - uses: actions/upload-artifact@v4
        with: { name: ilelah-backup, path: out/*.gpg, retention-days: 30 }
